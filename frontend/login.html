<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Joburg Hospital</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

<div class="auth-container">

  <div class="auth-left">
    <img src="" alt="Joburg Hospital" class="auth-left-image"
         onerror="this.style.display='none'">

    <div class="auth-left-overlay">
      <div class="auth-brand">
        <img src="images/imageslogo.jpg" alt="Logo" class="auth-logo-img"
             onerror="this.style.display='none'">
        <div>
          <h2>Joburg <span>Hospital</span></h2>
          <p>Healthcare Excellence</p>
        </div>
      </div>

      <div class="auth-illustration">
        <h3>Welcome Back</h3>
        <p>
          Sign in to access your hospital dashboard,
          appointments, medical services and healthcare information.
        </p>
      </div>

       <div class="social-icons">
        <a href="https://facebook.com/" target="_blank" rel="noopener" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
        <a href="https://instagram.com/" target="_blank" rel="noopener" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
        <a href="https://x.com/" target="_blank" rel="noopener" aria-label="X"><i class="fab fa-x-twitter"></i></a>
        <a href="https://linkedin.com/" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
        <a href="https://youtube.com/" target="_blank" rel="noopener" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
      </div>
    </div>
  </div>

  <div class="auth-right">
    <a href="index.html" class="auth-close" aria-label="Close and return to homepage">
      <i class="fas fa-times"></i>
    </a>

    <div class="auth-form-wrapper">
      <div class="auth-header">
        <div class="form-icon">
          <i class="fas fa-sign-in-alt"></i>
        </div>
        <h1>Welcome Back</h1>
        <p>Sign in to your Joburg Hospital account</p>
      </div>

      <form id="loginForm" class="auth-form" novalidate>
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope"></i>
            <input type="email" id="loginEmail" name="email"
                   placeholder="you@example.com" autocomplete="email" required>
          </div>
          <span class="error-message" id="loginEmailError"></span>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <div class="input-wrapper">
            <i class="fas fa-lock"></i>
            <input type="password" id="loginPassword" name="password"
                   placeholder="Enter your password" autocomplete="current-password" required>
            <button type="button" class="toggle-password" data-target="loginPassword"
                    aria-label="Show password">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <span class="error-message" id="loginPasswordError"></span>
        </div>

        <div class="login-options">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe">
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-password">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
          <span>Sign In</span>
          <i class="fas fa-arrow-right"></i>
        </button>
      </form>

      <div class="auth-divider"><span>OR</span></div>

      <div class="auth-footer">
        <p>Don't have an account? <a href="register.html">Create Account</a></p>
      </div>
    </div>
  </div>

</div>

<script src="js/auth.js"></script>
<script src="js/navigation.js"></script>
<script src="js/login.js"></script>
</body>
</html>
